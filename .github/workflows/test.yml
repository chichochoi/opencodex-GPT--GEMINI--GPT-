name: test

on:
  push:
  pull_request:

jobs:
  package-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Parse PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
          }
          if ($errors.Count) { $errors | Out-String | Write-Error }
      - name: Check shell syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/install.sh scripts/verify.sh
